name: Build & Deploy to Firebase App Distribution

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود من المستودع
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java لبناء تطبيقات Android
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. إعداد بيئة Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. تثبيت حزم مشروع Flutter
      - name: Install Dependencies
        run: flutter pub get

      # 5. بناء ملف الـ APK
      - name: Build Android APK
        run: flutter build apk --debug

      # 6. رفع ملف الـ APK إلى Firebase App Distribution
      - name: Upload to Firebase App Distribution
        uses: w9jds/firebase-action@master
        with:
          args: appdistribution:distribute build/app/outputs/flutter-apk/app-debug.apk --app ${{ secrets.FIREBASE_APP_ID }}
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_TOKEN }}